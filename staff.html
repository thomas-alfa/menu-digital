<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kopilicious – Staff</title>
<style>
:root{--bg:#F1F2EE;--surface:#fff;--ink:#1C2622;--muted:#5E6B65;--line:#D9DDD6;--green:#1F5B4A;--red:#B8352A;--redbg:#F8E3E0;--greenbg:#E1EEE8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--surface:#1A211E;--ink:#ECF0EC;--muted:#9AA8A1;--line:#2B3531;--green:#2F7A64;--red:#E8806F;--redbg:#3A2320;--greenbg:#1D2F28}}
:root[data-theme="dark"]{--bg:#121715;--surface:#1A211E;--ink:#ECF0EC;--muted:#9AA8A1;--line:#2B3531;--green:#2F7A64;--red:#E8806F;--redbg:#3A2320;--greenbg:#1D2F28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:20px;margin:0;flex:1;min-width:140px}
header select,header button{border:0;border-radius:10px;padding:10px 12px;background:#fff;color:#1C2622;font-weight:600}
.bar{position:sticky;top:64px;z-index:4;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
.bar input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
main{max-width:900px;margin:0 auto;padding:8px 16px 80px}
h2{font-size:18px;margin:22px 0 8px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
.card.off{border-color:var(--red);background:var(--redbg)}
.top{display:flex;align-items:center;gap:10px}
.top b{flex:1;font-size:18px}
.tog{min-width:96px;min-height:48px;border:0;border-radius:12px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.tog.off{background:var(--red)}
.tog:disabled{opacity:.5}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;border:2px solid var(--green);background:var(--greenbg);font-weight:600;cursor:pointer}
.chip.off{border-color:var(--red);background:var(--redbg);color:var(--red);text-decoration:line-through}
.hint{color:var(--muted);font-size:14px;margin:4px 0}
#login{max-width:360px;margin:12vh auto;padding:24px;background:var(--surface);border-radius:16px;border:1px solid var(--line);text-align:center}
#login input{width:100%;font-size:28px;text-align:center;letter-spacing:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:14px 0}
#login button{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:90%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login">
  <h1 style="margin:0">Halaman Staff</h1>
  <p class="hint">Masukkan PIN untuk menandai menu habis.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
  <button id="go">Masuk</button>
  <p class="hint" id="lmsg"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Stok Menu</h1>
    <select id="outlet" aria-label="Outlet"></select>
    <button id="reload">↻ Muat ulang</button>
  </header>
  <div class="bar"><input id="q" type="search" placeholder="Cari menu, misalnya gepuk" aria-label="Cari menu"></div>
  <main>
    <p class="hint">Tekan tombol <b>ADA</b> untuk menandai <b>HABIS</b>, tekan lagi untuk membuka kembali. Perubahan langsung terlihat oleh customer yang membuka menu.</p>
    <div id="list"></div>
  </main>
</div>
<div id="toast" hidden role="status"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyfnOgxwiVWRP-71HMHJZj9_4d1X1wd7tCxktrfqg4Brc7OlJWoUDtz3XB2SqFBET2KBA/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yes = s => /^(true|ya|yes|1)$/i.test(String(s ?? "").trim());
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e) {} } };
let PIN = store.get("staffPin") || "", DATA = null, outlet = +(store.get("staffOutlet") || 1);

function toast(t){ $("toast").textContent = t; $("toast").hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").hidden = true, 2500); }
async function post(body){
  const r = await fetch(API, { method: "POST", headers: {"Content-Type": "text/plain"}, body: JSON.stringify(Object.assign({ pin: PIN }, body)) });
  return r.json();
}
const toObj = rows => { rows = rows.slice(); const h = (rows.shift() || []).map(x => String(x).trim()); return rows.filter(r => r.some(x => String(x).trim() !== "")).map(r => Object.fromEntries(h.map((k, i) => [k, String(r[i] ?? "").trim()]))); };

async function login(){
  PIN = $("pin").value.trim() || PIN;
  if (!PIN) return;
  $("lmsg").textContent = "Memeriksa…";
  try {
    const r = await post({ action: "pin" });
    if (!r.ok){ $("lmsg").textContent = r.error || "PIN salah."; PIN = ""; store.set("staffPin", ""); return; }
    store.set("staffPin", PIN);
    $("login").hidden = true; $("app").hidden = false;
    load();
  } catch(e) { $("lmsg").textContent = "Tidak bisa terhubung. Cek internet lalu coba lagi."; }
}
$("go").onclick = login;
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

async function load(){
  try {
    const r = await fetch(API, { cache: "no-store" }); const d = await r.json();
    DATA = { menu: toObj(d.Menu), opsi: toObj(d.Opsi), outlets: toObj(d.Outlet) };
    $("outlet").innerHTML = DATA.outlets.map((o, i) => `<option value="${i + 1}" ${i + 1 === outlet ? "selected" : ""}>${esc(o["Nama Outlet"] || "Outlet " + (i + 1))}</option>`).join("");
    render();
  } catch(e) { toast("Gagal memuat data. Tekan Muat ulang."); }
}
$("reload").onclick = load;
$("outlet").onchange = () => { outlet = +$("outlet").value; store.set("staffOutlet", outlet); render(); };
$("q").oninput = render;

function render(){
  if (!DATA) return;
  const q = $("q").value.trim().toLowerCase(), col = "Habis Outlet " + outlet;
  const items = new Map();
  DATA.menu.forEach(r => {
    const n = r["Nama Menu"]; if (!n) return;
    if (!items.has(n)) items.set(n, { name: n, cat: r["Kategori"], vars: [] });
    items.get(n).vars.push({ label: r["Varian"], sold: yes(r[col]) });
  });
  const byCat = new Map();
  [...items.values()].filter(m => !q || (m.name + " " + m.cat).toLowerCase().includes(q)).forEach(m => {
    if (!byCat.has(m.cat)) byCat.set(m.cat, []); byCat.get(m.cat).push(m);
  });
  let h = `<h2>Menu di ${esc($("outlet").selectedOptions[0]?.text || "outlet ini")}</h2><div class="grid">` + [...byCat].map(([cat, list]) => list.map(m => {
    const all = m.vars.every(v => v.sold), some = m.vars.some(v => v.sold);
    const chips = m.vars.length > 1 ? `<div class="vars">${m.vars.map(v => `<button class="chip${v.sold ? " off" : ""}" data-n="${esc(m.name)}" data-v="${esc(v.label)}" data-s="${v.sold ? 0 : 1}" aria-pressed="${v.sold}">${esc(v.label)}</button>`).join("")}</div>` : "";
    return `<div class="card${all ? " off" : ""}"><div class="hint" style="margin:0 0 2px">${esc(cat)}</div><div class="top"><b>${esc(m.name)}</b><button class="tog${all ? " off" : ""}" data-n="${esc(m.name)}" data-s="${all ? 0 : 1}">${all ? "HABIS" : (some ? "SEBAGIAN" : "ADA")}</button></div>${chips}</div>`;
  }).join("")).join("") + `</div>`;
  const groups = new Map();
  DATA.opsi.filter(o => !q || (o["Pilihan"] + " " + o["Grup Opsi"]).toLowerCase().includes(q)).forEach(o => {
    const g = o["Grup Opsi"]; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(o);
  });
  if (groups.size){
    h += `<h2>Bahan tambahan (berlaku untuk semua outlet)</h2><div class="grid">${[...groups].map(([g, list]) => `<div class="card"><div class="top"><b>${esc(g)}</b></div><div class="vars">${list.map(o => { const s = yes(o["Habis"]); return `<button class="chip${s ? " off" : ""}" data-g="${esc(g)}" data-c="${esc(o["Pilihan"])}" data-s="${s ? 0 : 1}" aria-pressed="${s}">${esc(o["Pilihan"])}</button>`; }).join("")}</div></div>`).join("")}</div>`;
  }
  $("list").innerHTML = h || `<p class="hint">Tidak ada menu yang cocok.</p>`;
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const sold = b.dataset.s === "1", col = "Habis Outlet " + outlet;
  let body, rows;
  if (b.dataset.g !== undefined){
    body = { action: "opsi", group: b.dataset.g, choice: b.dataset.c, sold };
    rows = DATA.opsi.filter(o => o["Grup Opsi"] === b.dataset.g && o["Pilihan"] === b.dataset.c); rows.forEach(o => o["Habis"] = sold ? "TRUE" : "FALSE");
  } else {
    body = { action: "menu", name: b.dataset.n, outlet, sold };
    if (b.dataset.v !== undefined) body.variant = b.dataset.v;
    rows = DATA.menu.filter(r => r["Nama Menu"] === b.dataset.n && (body.variant === undefined || r["Varian"] === body.variant)); rows.forEach(r => r[col] = sold ? "TRUE" : "FALSE");
  }
  const label = (body.choice || body.name) + (body.variant ? " " + body.variant : "");
  render();
  try {
    const r = await post(body);
    if (!r.ok) throw new Error(r.error || "gagal");
    toast(label + (sold ? " ditandai HABIS" : " sudah ADA lagi"));
  } catch(err) {
    toast("Gagal menyimpan: " + label + ". Coba lagi.");
    load();
  }
});

if (PIN){ $("pin").value = ""; login(); }
setInterval(() => { if (!$("app").hidden && document.visibilityState === "visible") load(); }, 60000);
</script>
</body>
</html>
