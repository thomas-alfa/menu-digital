<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopilicious – Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2EE;--surface:#fff;--ink:#1C2622;--muted:#5E6B65;--line:#D9DDD6;--green:#1F5B4A;--on-green:#fff;--red:#B8352A;--tile:#E6EBE4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--surface:#1A211E;--ink:#ECF0EC;--muted:#9AA8A1;--line:#2B3531;--green:#2F7A64;--red:#E8806F;--tile:#232C28}}
:root[data-theme="dark"]{--bg:#121715;--surface:#1A211E;--ink:#ECF0EC;--muted:#9AA8A1;--line:#2B3531;--green:#2F7A64;--red:#E8806F;--tile:#232C28}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{background:var(--green);color:var(--on-green);padding:28px 20px 24px;background-image:linear-gradient(45deg,rgba(255,255,255,.08) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.08) 75%),linear-gradient(45deg,rgba(255,255,255,.08) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.08) 75%);background-size:36px 36px;background-position:0 0,18px 18px}
header h1{font:800 34px/1.05 "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 6px;letter-spacing:-.5px}
header p{margin:0;opacity:.9}
.meja{display:inline-block;margin-top:12px;background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:999px;font-weight:600;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
nav button{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:0 16px}
section{padding-top:20px}
h2{font:600 22px/1.2 "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ico{flex:none;width:56px;height:56px;border-radius:8px;background:var(--tile);display:grid;place-items:center;font-size:30px}
.ico img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600}
.info span,.row span.o{display:block;color:var(--muted);font-size:14px}
.price{font-weight:600;margin-top:2px;color:var(--red)}
.pill{flex:none;border:0;background:var(--green);color:var(--on-green);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.sold{color:var(--muted);font-size:14px;font-weight:500}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.step .add{background:var(--green);color:var(--on-green);border-color:var(--green)}
.step output{min-width:18px;text-align:center;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:12}
.ov[hidden],#bar[hidden]{display:none}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;border:0;background:var(--green);color:var(--on-green);padding:14px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.big:disabled{opacity:.5;cursor:not-allowed}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.panel{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;min-width:0}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:18px;padding:12px 0}
label.f{display:block;font-weight:500;margin:10px 0 4px}
input[type=text],input:not([type]),textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.close{float:right;border:0;background:none;font-size:15px;cursor:pointer;color:var(--muted);padding:4px}
.hint{color:var(--muted);font-size:13px;margin:2px 0 6px}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;font-size:17px;padding:0}
label.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
label.opt span:nth-of-type(1){flex:1}
label.opt input{width:20px;height:20px;accent-color:var(--green)}
</style>
</head>
<body>
<header>
  <h1 id="shop"></h1>
  <p>Scan, choose, order. No app needed.</p>
  <span class="meja" id="mejaTag" hidden></span>
</header>
<nav id="cats" aria-label="Menu categories"></nav>
<main id="menu"></main>

<div id="bar" hidden><button class="big" id="openCart"><span id="cnt"></span><span id="tot"></span></button></div>

<div id="opt" class="ov" hidden role="dialog" aria-modal="true" aria-labelledby="optT">
  <div class="panel">
    <button class="close" id="closeOpt">Close</button>
    <h2 id="optT"></h2>
    <div id="optBody"></div>
    <button class="big" id="optAdd" style="margin-top:8px;justify-content:center"></button>
  </div>
</div>

<div id="sheet" class="ov" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <button class="close" id="closeCart">Close</button>
    <h2 id="sheetTitle">Your order</h2>
    <div id="lines"></div>
    <div class="total"><span>Total</span><span id="sum"></span></div>
    <label class="f" for="table">Table number</label>
    <input id="table" inputmode="numeric" placeholder="e.g. 5">
    <label class="f" for="note">Notes for the kitchen</label>
    <textarea id="note" rows="2" placeholder="e.g. tambah es, tanpa gula"></textarea>
    <button class="big" id="send" style="margin-top:16px;justify-content:center">Send order via WhatsApp</button>
    <p class="hint">Staff will confirm your order and bring it to your table. Pay at the counter.</p>
    <div id="waBox" hidden>
      <p class="hint">If WhatsApp did not open, tap the button below or copy the order.</p>
      <a class="big" id="waLink" target="_blank" rel="noopener" style="justify-content:center;text-decoration:none;margin-bottom:8px">Open WhatsApp</a>
      <textarea id="waMsg" rows="5" readonly aria-label="Order text"></textarea>
      <button class="big" id="copyMsg" style="justify-content:center;margin-top:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line)">Copy order text</button>
    </div>
  </div>
</div>

MENU.forEach((m,i)=>m.id=i);
const $ = id => document.getElementById(id);
const rm = n => CONFIG.cur + " " + n.toFixed(2);
const cats = [...new Set(MENU.map(m=>m.cat))];
const lines = [];   // {k, id, sel:[[group,choice],...], qty}
let cur = null;

$("shop").textContent = CONFIG.shop;
document.title = CONFIG.shop + " – Digital Menu";
const mejaParam = new URLSearchParams(location.search).get("meja");
if (mejaParam) { $("mejaTag").textContent = "Table " + mejaParam; $("mejaTag").hidden = false; $("table").value = mejaParam; }

const unit = (m,sel) => m.price + sel.reduce((s,[g,c])=>s+m.groups[g].c[c][1],0);
const optText = (m,sel) => sel.map(([g,c])=>m.groups[g].c[c][0]).join(", ");
const fromPrice = m => m.price + (m.groups||[]).filter(g=>g.min>0).reduce((s,g)=>s+Math.min(...g.c.map(x=>x[1])),0);

$("cats").innerHTML = cats.map((c,i)=>`<button data-cat="${i}" ${i===0?'aria-current="true"':''}>${c}</button>`).join("");
$("menu").innerHTML = cats.map((c,i)=>`<section id="cat${i}"><h2>${c}</h2>${MENU.filter(m=>m.cat===c).map(itemHTML).join("")}</section>`).join("");
function itemHTML(m){
  const btn = m.sold ? `<span class="sold">Sold out</span>` : `<button class="pill" data-act="open" data-id="${m.id}" aria-label="${m.groups?"Choose options for ":"Add "}${m.name}">${m.groups?"Choose":"Add"}</button>`;
  return `<div class="item"><div class="ico" aria-hidden="true">${m.img?`<img src="${m.img}" alt="" loading="lazy">`:m.icon}</div><div class="info"><b>${m.no?m.no+". ":""}${m.name}</b><span>${m.desc}</span><div class="price">${m.groups?"From ":""}${rm(fromPrice(m))}</div></div>${btn}</div>`;
}

function addLine(id,sel){
  const k = JSON.stringify([id,sel]), l = lines.find(x=>x.k===k);
  l ? l.qty++ : lines.push({k,id,sel,qty:1});
  refresh();
}
function refresh(){
  const count = lines.reduce((s,l)=>s+l.qty,0);
  const total = lines.reduce((s,l)=>s+l.qty*unit(MENU[l.id],l.sel),0);
  $("bar").hidden = !count;
  $("cnt").textContent = count + (count===1?" item":" items") + " in your order";
  $("tot").textContent = rm(total);
  $("sum").textContent = rm(total);
  $("lines").innerHTML = lines.map((l,i)=>{const m=MENU[l.id];return `<div class="row"><div class="n"><b>${m.name}</b><span class="o">${optText(m,l.sel)}</span></div><div class="step"><button data-act="lsub" data-i="${i}" aria-label="Remove one ${m.name}">−</button><output>${l.qty}</output><button class="add" data-act="ladd" data-i="${i}" aria-label="Add one ${m.name}">+</button></div><span>${rm(l.qty*unit(m,l.sel))}</span></div>`}).join("");
  if (!count) $("sheet").hidden = true;
}

function openOpt(id){
  cur = id; const m = MENU[id];
  $("optT").textContent = m.name;
  $("optBody").innerHTML = m.groups.map((g,gi)=>{
    const radio = g.max===1 && g.min===1;
    return `<fieldset><legend>${g.t}</legend><p class="hint">${g.max===1?"Choose 1":"Choose up to "+g.max} (${g.min?"required":"optional"})</p>${g.c.map((c,ci)=>`<label class="opt"><input type="${radio?"radio":"checkbox"}" name="g${gi}" value="${ci}" data-g="${gi}"><span>${c[0]}</span><span>${c[1]?rm(c[1]):""}</span></label>`).join("")}</fieldset>`;
  }).join("");
  $("opt").hidden = false; calc();
}
const picks = () => [...document.querySelectorAll("#optBody input:checked")].map(i=>[+i.dataset.g,+i.value]);
function calc(){
  const m = MENU[cur], sel = picks();
  const ok = m.groups.every((g,gi)=>sel.filter(s=>s[0]===gi).length>=g.min);
  $("optAdd").disabled = !ok;
  $("optAdd").textContent = ok ? "Add to order  " + rm(unit(m,sel)) : "Choose the required option";
}
$("optBody").addEventListener("change", e=>{
  const i = e.target, g = +i.dataset.g, max = MENU[cur].groups[g].max;
  if (i.type==="checkbox" && i.checked){
    const ch = [...document.querySelectorAll(`#optBody input[data-g="${g}"]:checked`)];
    if (ch.length>max){ if(max===1) ch.forEach(x=>{if(x!==i)x.checked=false}); else i.checked=false; }
  }
  calc();
});
$("optAdd").onclick = ()=>{ addLine(cur,picks()); $("opt").hidden=true; };
$("closeOpt").onclick = ()=>{ $("opt").hidden=true; };

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const a = b.dataset.act;
  if (a==="open"){ const id=+b.dataset.id; MENU[id].groups ? openOpt(id) : addLine(id,[]); }
  else if (a==="ladd"){ lines[+b.dataset.i].qty++; refresh(); }
  else if (a==="lsub"){ const i=+b.dataset.i; if(--lines[i].qty<=0) lines.splice(i,1); refresh(); }
  else if (b.dataset.cat!==undefined){ $("cat"+b.dataset.cat).scrollIntoView({behavior:"smooth"}); }
});
$("openCart").onclick = ()=>{ $("sheet").hidden=false; };
$("closeCart").onclick = ()=>{ $("sheet").hidden=true; };
["sheet","opt"].forEach(id=>$(id).addEventListener("click", e=>{ if(e.target===$(id)) $(id).hidden=true; }));
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ $("sheet").hidden=true; $("opt").hidden=true; } });

const io = new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting) document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-current", b.dataset.cat===en.target.id.slice(3)));
}),{rootMargin:"-30% 0px -60% 0px"});
cats.forEach((_,i)=>io.observe($("cat"+i)));

$("send").onclick = ()=>{
  if(!lines.length) return;
  const total = lines.reduce((s,l)=>s+l.qty*unit(MENU[l.id],l.sel),0);
  const t = $("table").value.trim(), note = $("note").value.trim();
  const body = lines.map(l=>{const m=MENU[l.id]; return `${l.qty} x ${m.no?m.no+". ":""}${m.name}${l.sel.length?" - "+optText(m,l.sel):""}`}).join("\n");
  const msg = `New order${t?" - Table "+t:""}\n\n${body}\n\nTotal: ${rm(total)}${note?"\nNotes: "+note:""}`;
  const url = "https://wa.me/"+CONFIG.wa+"?text="+encodeURIComponent(msg);
  $("waLink").href = url; $("waMsg").value = msg; $("waBox").hidden = false;
  try { window.open(url, "_blank"); } catch(e) {}
};
$("copyMsg").onclick = async ()=>{
  const t = $("waMsg"), b = $("copyMsg");
  try { await navigator.clipboard.writeText(t.value); }
  catch(e) { t.select(); try { document.execCommand("copy"); } catch(_) {} }
  b.textContent = "Copied";
  setTimeout(()=>{ b.textContent = "Copy order text"; }, 1500);
};
refresh();
</script>
